<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Animated Admission Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:35px;
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 15px 35px rgba(0,0,0,.35);
    animation:show .8s ease;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h2{
    text-align:center;
    color:#fff;
    margin-bottom:25px;
    font-size:32px;
}

.row{
    display:flex;
    gap:15px;
}

.input-box{
    width:100%;
    margin-bottom:18px;
}

.input-box label{
    color:#fff;
    display:block;
    margin-bottom:6px;
    font-size:14px;
}

.input-box input,
.input-box select,
.input-box textarea{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    font-size:15px;
    transition:.3s;
}

.input-box textarea{
    resize:none;
    height:100px;
}

.input-box input:focus,
.input-box select:focus,
.input-box textarea:focus{
    transform:scale(1.02);
    box-shadow:0 0 12px rgba(0,170,255,.5);
}

.preview{
    width:120px;
    height:120px;
    border-radius:50%;
    border:3px solid #fff;
    margin:10px auto;
    overflow:hidden;
    display:none;
}

.preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#00b4ff;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0090cc;
}

.success{
    display:none;
    text-align:center;
    color:#00ff99;
    font-weight:bold;
    margin-top:20px;
    font-size:18px;
}

@media(max-width:700px){
.row{
flex-direction:column;
gap:0;
}
}
</style>
</head>

<body>

<div class="container">

<h2>Student Admission Form</h2>

<form id="admissionForm">

<div class="row">

<div class="input-box">
<label>Full Name</label>
<input type="text" placeholder="Enter Full Name" required>
</div>

<div class="input-box">
<label>Email Address</label>
<input type="email" placeholder="Enter Email" required>
</div>

</div>

<div class="row">

<div class="input-box">
<label>Mobile Number</label>
<input type="tel" placeholder="Enter Mobile Number" required>
</div>

<div class="input-box">
<label>Date of Birth</label>
<input type="date" required>
</div>

</div>

<div class="row">

<div class="input-box">
<label>Select Gender</label>
<select required>
<option value="">Choose Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="input-box">
<label>Select Course</label>
<select required>
<option value="">Choose Course</option>
<option>BCA</option>
<option>BBA</option>
<option>BA</option>
<option>B.Com</option>
<option>B.Sc</option>
<option>MCA</option>
<option>MBA</option>
</select>
</div>

</div>
