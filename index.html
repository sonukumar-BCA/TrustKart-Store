<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TrustKart - Premium Marketplace</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f6f8;
}


/* Top Bar */

.topbar{
    background:#172337;
    color:white;
    padding:10px;
    text-align:center;
    font-size:14px;
}


/* Header */

.header{

    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 5%;
    box-shadow:0 2px 10px #ddd;

}


.logo{

    font-size:30px;
    font-weight:bold;
    color:#2874f0;

}


.search{

    width:45%;

}


.search input{

    width:100%;
    padding:15px 20px;
    border:none;
    background:#f0f5ff;
    border-radius:8px;
    outline:none;
    font-size:15px;

}


.actions button{

    padding:12px 20px;
    border:none;
    border-radius:5px;
    margin-left:10px;
    cursor:pointer;
    font-weight:bold;

}


.login{

    background:#2874f0;
    color:white;

}


.cart{

    background:#ff9f00;
    color:white;

}



/* Category Menu */


.categories{

    display:flex;
    justify-content:center;
    gap:30px;
    background:white;
    padding:20px;
    margin-top:10px;

}


.cat{

    text-align:center;
    font-size:15px;
    cursor:pointer;

}


.cat span{

    display:block;
    font-size:35px;
    margin-bottom:5px;

}



/* Hero */


.hero{

    margin:20px 5%;
    border-radius:15px;
    padding:60px;
    background:
    linear-gradient(120deg,#2874f0,#00c6ff);
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;

}


.hero h1{

    font-size:48px;

}


.hero p{

    font-size:20px;
    margin:20px 0;

}


.hero button{

    padding:15px 35px;
    border:none;
    border-radius:30px;
    background:#ff9f00;
    color:white;
    font-size:18px;

}


.hero-icon{

    font-size:150px;

}



/* Mobile */

@media(max-width:768px){

.header{

    flex-direction:column;
    gap:15px;

}


.search{

    width:90%;

}


.categories{

    overflow:auto;
    justify-content:flex-start;

}


.hero{

    flex-direction:column;
    text-align:center;

}


.hero h1{

    font-size:35px;

}

}

</style>

</head>


<body>


<div class="topbar">
🔥 TrustKart Mega Sale | Best Deals Every Day
</div>



<div class="header">


<div class="logo">
🛒 TrustKart
</div>


<div class="search">

<input placeholder="Search for products, brands and more">

</div>


<div class="actions">

<button class="login">
Login
</button>

<button class="cart">
Cart 🛍️
</button>

</div>


</div>



<div class="categories">

<div class="cat">
<span>👕</span>
Fashion
</div>

<div class="cat">
<span>📱</span>
Mobiles
</div>

<div class="cat">
<span>💻</span>
Electronics
</div>

<div class="cat">
<span>👟</span>
Footwear
</div>

<div class="cat">
<span>⌚</span>
Watches
</div>

</div>



<section class="hero">


<div>

<h1>
Shop Smart<br>
With TrustKart
</h1>


<p>
Premium products at amazing prices
</p>


<button>
Shop Now
</button>


</div>


<div class="hero-icon">
🛍️
</div>


</section>



</body>
</html>
