<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Admission Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#00c6ff,#0072ff);
}

.container{
    width:420px;
    background:#fff;
    border-radius:20px;
    padding:35px;
    box-shadow:0 20px 40px rgba(0,0,0,.3);
    animation:zoomIn 1s ease;
}

@keyframes zoomIn{
    from{
        opacity:0;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.container h2{
    text-align:center;
    color:#0072ff;
    margin-bottom:25px;
}

.input-box{
    margin-bottom:18px;
}

.input-box input,
.input-box select{
    width:100%;
    padding:14px;
    border:2px solid #ddd;
    border-radius:10px;
    outline:none;
    transition:.4s;
    font-size:15px;
}

.input-box input:focus,
.input-box select:focus{
    border-color:#0072ff;
    box-shadow:0 0 10px rgba(0,114,255,.4);
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#0072ff;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    transition:.4s;
}

button:hover{
    background:#0056d6;
    transform:translateY(-3px);
}

.success{
    text-align:center;
    color:green;
    margin-top:15px;
    display:none;
    font-weight:bold;
}
</style>

</head>
    <script>
const form = document.getElementById("admissionForm");
const msg = document.getElementById("successMsg");

form.addEventListener("submit", function(e){
    e.preventDefault();

    msg.style.display = "block";
    msg.style.opacity = "0";

    setTimeout(() => {
        msg.style.opacity = "1";
    },100);

    setTimeout(() => {
        form.reset();
        msg.style.display = "none";
    },3000);
});
    </script>
<body>

<div class="container">

<h2>Admission Form</h2>

<form id="admissionForm">

<div class="input-box">
<input type="text" placeholder="Full Name" required>
</div>

<div class="input-box">
<input type="email" placeholder="Email Address" required>
</div>

<div class="input-box">
<input type="tel" placeholder="Mobile Number" required>
</div>

<div class="input-box">
<select required>
<option value="">Select Course</option>
<option>BCA</option>
<option>BBA</option>
<option>B.Sc</option>
<option>BA</option>
<option>B.Com</option>
</select>
</div>

<div class="input-box">
<input type="text" placeholder="City" required>
</div>
<!-- ===== PART 2 START ===== -->

<div class="input-box">
    <input type="date" required>
</div>

<div class="input-box">
    <select required>
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
    </select>
</div>

<div class="input-box">
    <input type="text" placeholder="Father's Name" required>
</div>

<div class="input-box">
    <input type="text" placeholder="Mother's Name" required>
</div>

<div class="input-box">
    <textarea placeholder="Full Address" required
    style="width:100%;height:90px;padding:14px;border:2px solid #ddd;border-radius:10px;outline:none;font-size:15px;resize:none;"></textarea>
</div>

<div class="input-box">
    <select required>
        <option value="">Select State</option>
        <option>Uttar Pradesh</option>
        <option>Bihar</option>
        <option>Delhi</option>
        <option>Jharkhand</option>
        <option>Madhya Pradesh</option>
        <option>Rajasthan</option>
        <option>Chhattisgarh</option>
        <option>West Bengal</option>
    </select>
</div>

<div class="input-box">
    <input type="file" accept="image/*">
</div>

<!-- ===== PART 2 END ===== -->

<button type="submit">Submit Admission</button>
<button type="submit">Submit Admission</button>

<div class="success" id="successMsg">
✅ Admission Submitted Successfully!
</div>

</form>

</div>

<script>
const form=document.getElementById("admissionForm");
const msg=document.getElementById("successMsg");

form.addEventListener("submit",function(e){
e.preventDefault();

msg.style.display="block";

setTimeout(()=>{
form.reset();
msg.style.display="none";
},3000);

});
</script>

</body>
</html>
