<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Animated Admission Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:35px;
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 15px 35px rgba(0,0,0,.35);
    animation:show .8s ease;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h2{
    text-align:center;
    color:#fff;
    margin-bottom:25px;
    font-size:32px;
}

.row{
    display:flex;
    gap:15px;
}

.input-box{
    width:100%;
    margin-bottom:18px;
}

.input-box label{
    color:#fff;
    display:block;
    margin-bottom:6px;
    font-size:14px;
}

.input-box input,
.input-box select,
.input-box textarea{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    font-size:15px;
    transition:.3s;
}

.input-box textarea{
    resize:none;
    height:100px;
}

.input-box input:focus,
.input-box select:focus,
.input-box textarea:focus{
    transform:scale(1.02);
    box-shadow:0 0 12px rgba(0,170,255,.5);
}

.preview{
    width:120px;
    height:120px;
    border-radius:50%;
    border:3px solid #fff;
    margin:10px auto;
    overflow:hidden;
    display:none;
}

.preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

button{
    width:100%;
    height:55px;
    border:none;
    border-radius:50px;
    background:linear-gradient(45deg,#00c6ff,#0072ff,#00c6ff);
    background-size:300% 300%;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    letter-spacing:1px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:.4s;
    animation:gradientMove 4s linear infinite;
}

button::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:rgba(255,255,255,.3);
    transform:skewX(-30deg);
    transition:.6s;
}

button:hover::before{
    left:120%;
}

button:hover{
    transform:translateY(-5px) scale(1.03);
    box-shadow:0 15px 35px rgba(0,114,255,.5);
}

button:active{
    transform:scale(.97);
}

@keyframes gradientMove{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}
.success{
    display:none;
    text-align:center;
    color:#00ff99;
    font-weight:bold;
    margin-top:20px;
    font-size:18px;
}

@media(max-width:700px){
.row{
flex-direction:column;
gap:0;
}
}
</style>
</head>

<body>

<div class="container">

<h2>Student Admission Form</h2>

<form id="admissionForm">

<div class="row">

<div class="input-box">
<label>Full Name</label>
<input type="text" placeholder="Enter Full Name" required>
</div>

<div class="input-box">
<label>Email Address</label>
<input type="email" placeholder="Enter Email" required>
</div>

</div>

<div class="row">

<div class="input-box">
<label>Mobile Number</label>
<input type="tel" placeholder="Enter Mobile Number" required>
</div>

<div class="input-box">
<label>Date of Birth</label>
<input type="date" required>
</div>

</div>

<div class="row">

<div class="input-box">
<label>Select Gender</label>
<select required>
<option value="">Choose Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="input-box">
<label>Select Course</label>
<select required>
<option value="">Choose Course</option>
<option>BCA</option>
<option>BBA</option>
<option>BA</option>
<option>B.Com</option>
<option>B.Sc</option>
<option>MCA</option>
<option>MBA</option>
</select>
</div>

</div>

<!-- PART 2 START -->
<div class="row">

<div class="input-box">
<label>Father's Name</label>
<input type="text" placeholder="Enter Father's Name" required>
</div>

<div class="input-box">
<label>Mother's Name</label>
<input type="text" placeholder="Enter Mother's Name" required>
</div>

</div>

<div class="input-box">
<label>Full Address</label>
<textarea placeholder="Enter Full Address" required></textarea>
</div>

<div class="row">

<div class="input-box">
<label>Select State</label>
<select id="state" required>
<option value="">Select State</option>
<option>Uttar Pradesh</option>
<option>Bihar</option>
<option>Jharkhand</option>
<option>Delhi</option>
<option>Rajasthan</option>
<option>Madhya Pradesh</option>
<option>West Bengal</option>
<option>Chhattisgarh</option>
</select>
</div>

<div class="input-box">
<label>City</label>
<input type="text" placeholder="Enter City" required>
</div>

</div>

<div class="row">

<div class="input-box">
<label>PIN Code</label>
<input type="number" placeholder="Enter PIN Code" required>
</div>

<div class="input-box">
<label>Upload Photo</label>
<input type="file" id="photo" accept="image/*">
</div>

</div>

<div class="preview" id="preview">
<img id="previewImg" src="" alt="Preview">
</div>

<div class="row">

<div class="input-box">
<label>Password</label>
<input type="password" placeholder="Create Password" required>
</div>

<div class="input-box">
<label>Confirm Password</label>
<input type="password" placeholder="Confirm Password" required>
</div>

</div>

<div class="input-box">
<label>
<input type="checkbox" required>
 I agree to the Terms & Conditions
</label>
</div>

<button type="submit">
🚀 Submit Admission
</button>

<div class="success" id="successMsg">
✅ Admission Submitted Successfully!
</div>

</form>

</div>

<!-- PART 3 START -->
    <script>
const form = document.getElementById("admissionForm");
const msg = document.getElementById("successMsg");

const photo = document.getElementById("photo");
const preview = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");

photo.addEventListener("change", function () {
    const file = this.files[0];

    if (file) {
        const reader = new FileReader();

        reader.onload = function (e) {
            previewImg.src = e.target.result;
            preview.style.display = "block";
        };

        reader.readAsDataURL(file);
    }
});

form.addEventListener("submit", function (e) {
    e.preventDefault();

    msg.style.display = "block";

    setTimeout(() => {
        form.reset();
        preview.style.display = "none";
        msg.style.display = "none";
    }, 3000);
});
</script>

</body>
</html>
