<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TrustKart Store | India's Trusted Electronics Store</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#f5f7fb;
color:#333;
}

a{
text-decoration:none;
}

img{
max-width:100%;
display:block;
}

/* =========================
   NAVBAR
========================= */

nav{

position:sticky;
top:0;
z-index:1000;

display:flex;
justify-content:space-between;
align-items:center;

padding:16px 8%;

background:#0a3d91;

box-shadow:0 4px 12px rgba(0,0,0,.15);

}

.logo{

font-size:30px;
font-weight:700;
color:#fff;

}

.logo span{

color:#ffd54f;

}

.menu{

display:flex;
gap:28px;

}

.menu a{

color:white;
font-weight:500;
transition:.3s;

}

.menu a:hover{

color:#ffd54f;

}

.search-box{

display:flex;
align-items:center;
background:white;
border-radius:30px;
overflow:hidden;

}

.search-box input{

border:none;
outline:none;
padding:10px 15px;
width:180px;

}

.search-box button{

border:none;
background:#ffd54f;
padding:10px 15px;
cursor:pointer;

}

/* =========================
   HERO
========================= */

.hero{

min-height:90vh;

display:flex;
justify-content:center;
align-items:center;

text-align:center;

padding:60px 8%;

background:
linear-gradient(rgba(10,61,145,.82),rgba(0,184,148,.82)),
url("https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;

color:white;

}

.hero-content{

max-width:760px;

}

.hero h1{

font-size:52px;
margin-bottom:20px;

}

.hero h1 span{

color:#ffd54f;

}

.hero p{

font-size:20px;
line-height:1.8;
margin-bottom:35px;

}

.hero-buttons{

display:flex;
justify-content:center;
gap:18px;
flex-wrap:wrap;

}

.btn{

padding:15px 35px;

border:none;

border-radius:50px;

cursor:pointer;

font-size:17px;

font-weight:600;

transition:.3s;

}

.btn-primary{

background:#ffd54f;
color:#111;

}

.btn-primary:hover{

background:#ffca28;
transform:translateY(-4px);

}

.btn-outline{

background:transparent;
border:2px solid white;
color:white;

}

.btn-outline:hover{

background:white;
color:#0a3d91;

}

/* ===== PART 2 CSS YAHAN SE SHURU HOGI ===== */

</style>

</head>

<body>

<nav>

<div class="logo">

🛒 Trust<span>Kart</span>

</div>

<div class="menu">

<a href="#">Home</a>

<a href="#">Categories</a>

<a href="#">Products</a>

<a href="#">Deals</a>

<a href="#">Contact</a>

</div>

<div class="search-box">

<input type="text" placeholder="Search Products">

<button>🔍</button>

</div>

</nav>

<section class="hero">

<div class="hero-content">

<h1>

India's Trusted
<span>Electronics Store</span>

</h1>

<p>

Shop Mobiles, Laptops,
Smart Watches,
Earbuds and Accessories
at Best Prices.

</p>

<div class="hero-buttons">

<button class="btn btn-primary">

🛍 Shop Now

</button>

<button class="btn btn-outline">

🔥 Explore Deals

</button>

</div>

</div>

</section>

<!-- PART 2 YAHAN SE START HOGA -->
